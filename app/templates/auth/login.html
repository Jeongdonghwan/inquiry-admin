<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>{{ config.COMPANY_NAME }} 상담관리 · 로그인</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
</head>
<body class="login-body">
<main class="login-card">
  <div class="login-brand">
    <div class="login-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18M6 21h12M3 7h18M6 7l-3 7a3.5 3.5 0 0 0 7 0zM18 7l-3 7a3.5 3.5 0 0 0 7 0z"/></svg></div>
    <h1>{{ config.COMPANY_NAME }}</h1>
    <p>상담관리 시스템</p>
  </div>
  <form method="post" class="login-form" autocomplete="on">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    {% with msgs = get_flashed_messages() %}{% if msgs %}<p class="error">{{ msgs[0] }}</p>{% endif %}{% endwith %}
    <label>아이디<input name="login_id" required autofocus autocomplete="username"></label>
    <label>비밀번호<input name="password" type="password" required autocomplete="current-password"></label>
    <button type="submit" class="btn primary">로그인</button>
  </form>
  <p class="login-note">직원 전용입니다. 계정이 없거나 비밀번호를 잊으면 관리자에게 문의하세요.</p>
</main>
</body>
</html>
