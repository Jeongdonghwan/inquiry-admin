{% extends "base.html" %}
{% block title %}{{ data.name or '양식 추가' }} · 상담지 양식{% endblock %}
{% block content %}
<header class="topbar">
  <div class="title"><h1>{{ data.name or '양식 추가' }}</h1><span class="sub"><a href="{{ url_for('settings.forms') }}">상담지 양식</a> › 빌더 {% if form %}· v{{ form.version }}{% endif %}</span></div>
  <button type="button" class="btn" id="fb-json-toggle">JSON으로 편집</button>
  <button type="button" class="btn primary" id="fb-save">저장</button>
</header>
<script type="application/json" id="fb-data">{{ {"schema": data.schema, "saved_keys": saved_keys, "types": types|list, "is_new": form is none}|tojson }}</script>
<div class="content builder" id="builder" data-save="{{ url_for('settings.form_builder', fid=form.id) if form else url_for('settings.form_builder') }}" data-preview="{{ url_for('settings.form_preview') }}" data-list="{{ url_for('settings.forms') }}">
  <section class="panel form fb-meta">
    <div class="two">
      <label>양식명<input id="fb-name" value="{{ data.name }}" maxlength="50"></label>
      <label>업종<select id="fb-cat"><option value="">공통</option>{% for k, v in cats.items() %}<option value="{{ k }}" {{ 'selected' if data.category == k }}>{{ v }}</option>{% endfor %}</select></label>
    </div>
    <label>매칭 유형 (쉼표 구분)<input id="fb-keys" value="{{ data.inquiry_type_keys|join(', ') }}" placeholder="개인회생, 회생, 파산"><small>문의의 유형 문자열에 이 중 하나가 포함되면 자동 선택</small></label>
    <label class="check"><input type="checkbox" id="fb-active" {{ 'checked' if data.is_active }}> 사용</label>
    <div class="flash err" id="fb-error" hidden></div>
  </section>

  <div class="fb-grid" id="fb-visual">
    <section class="panel fb-tree">
      <div class="fb-head">섹션 · 필드 <button type="button" class="btn sm" data-add-section>+ 섹션</button></div>
      <div id="fb-sections"></div>
    </section>
    <section class="panel fb-props" id="fb-props"><div class="empty small">왼쪽에서 필드를 선택하세요</div></section>
  </div>
  <section class="panel fb-json" id="fb-jsonbox" hidden>
    <textarea id="fb-json" rows="24" spellcheck="false"></textarea>
    <div class="row"><button type="button" class="btn sm" id="fb-json-apply">적용</button><span class="muted small">같은 검증 규칙이 적용됩니다</span></div>
  </section>
  <section class="panel fb-preview"><div class="fb-head">실시간 미리보기</div><div id="fb-prev" class="sheet"></div></section>
</div>

{% endblock %}
